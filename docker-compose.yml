services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: compilix-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - FRONTEND_ORIGIN=http://localhost:3000
      - EXECUTION_TIMEOUT_MS=10000
      - MAX_CODE_SIZE_BYTES=65536
      - MAX_STDIN_SIZE_BYTES=65536
      - MAX_OUTPUT_SIZE_BYTES=262144
      - MAX_CONCURRENT_EXECUTIONS=5
      - DOCKER_CPU_LIMIT=1.0
      - DOCKER_MEMORY_LIMIT=256m
      - DOCKER_PIDS_LIMIT=64
    volumes:
      # Mount Docker socket so backend can invoke language runner containers
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend/temp:/app/temp
    networks:
      - compilix-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: compilix-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - compilix-net

networks:
  compilix-net:
    driver: bridge
